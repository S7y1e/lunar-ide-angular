name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Lunar Angular Preview ${context.ref.replace('refs/tags/', '')}`,
              body: 'Download the installer for your OS below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    # crates.io downloads intermittently fail on the Windows runner with
    # "[16] Error in the HTTP2 framing layer". Disable HTTP/2 multiplexing and
    # retry to make the cargo fetch reliable.
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file \
            curl \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Download sidecar binaries
        run: bun run scripts/download-binaries.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  plugins:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Package and upload plugins
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .tag_name)
          (cd figma-plugin && zip -r ../lunar-figma-plugin.zip .)
          gh release upload "$TAG" \
            studio-plugin/LunarBridge.rbxm \
            lunar-figma-plugin.zip \
            --clobber --repo "$REPO"

  checksums:
    needs: [create-release, build, plugins]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name != "SHA256SUMS") | "\(.id)\t\(.name)"' > /tmp/assets.tsv
          mkdir -p assets && cd assets
          while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            echo "Fetching $name"
            gh api "repos/${REPO}/releases/assets/${id}" \
              -H "Accept: application/octet-stream" > "$name"
          done < /tmp/assets.tsv
          sha256sum * > ../SHA256SUMS
          cd ..
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
          TAG=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .tag_name)
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$REPO"

  publish-release:
    needs: [create-release, build, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
