<style>
    body {
        font-family: Inter, sans-serif;
        margin: 0;
        padding: 14px;
        color: #e6e6e6;
        background: #2c2c2c;
    }
    button {
        width: 100%;
        height: 34px;
        border: none;
        border-radius: 6px;
        background: #5b8def;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover {
        background: #6f9bf2;
    }
    #status {
        margin: 10px 0 0;
        font-size: 12px;
        min-height: 16px;
    }
    .hint {
        margin: 0 0 12px;
        font-size: 11px;
        color: #999;
        line-height: 1.4;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
    }
    .brand svg {
        width: 22px;
        height: 22px;
        border-radius: 5px;
    }
    .brand span {
        font-size: 13px;
        font-weight: 600;
        color: #e6e6e6;
    }
</style>

<div class="brand">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <rect x="64" y="64" width="896" height="896" rx="200" fill="#2E3440" />
        <circle cx="456" cy="519" r="314" fill="#88C0D0" />
        <circle cx="613" cy="475" r="284" fill="#2E3440" />
        <circle cx="743" cy="318" r="45" fill="#ECEFF4" />
    </svg>
    <span>Lunar UI Export</span>
</div>
<p class="hint">Select a frame in Figma, make sure the Lunar IDE app is open, then send.</p>
<button id="send">Send selected frame to Lunar</button>
<p id="status"></p>

<script>
    document.getElementById("send").onclick = () => {
        document.getElementById("status").textContent = "Sending…";
        parent.postMessage({ pluginMessage: { type: "send" } }, "*");
    };
    onmessage = (e) => {
        const m = e.data.pluginMessage;
        if (!m || m.type !== "status") return;
        const s = document.getElementById("status");
        s.textContent = m.text;
        s.style.color = m.ok ? "#3fb950" : "#f85149";
    };
</script>
