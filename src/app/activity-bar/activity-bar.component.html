<div class="bar">
    @for (view of views; track view.id) {
        <button
            class="btn"
            [class.active]="layout.isOpen(view.id)"
            [title]="view.label"
            (click)="layout.toggle(view.id)"
        >
            <span class="glyph">{{ view.glyph }}</span>
        </button>
    }
    <div class="footer">
        <ng-content select="[footer]" />
    </div>
</div>
