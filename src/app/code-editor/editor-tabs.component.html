<div
    #container
    class="tabs"
    (wheel)="onWheel($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="endDrag()"
    (pointercancel)="endDrag()"
>
    @for (path of groups.files(); track path; let i = $index) {
        <div
            data-tab
            class="tab"
            [class.active]="path === groups.activeFile()"
            [class.dragging]="path === draggingPath()"
            (pointerdown)="startDrag($event, i)"
        >
            <span class="name">{{ baseName(path) }}</span>
            <button
                class="close"
                [class.dirty]="groups.dirtyFiles().has(path)"
                [attr.aria-label]="groups.dirtyFiles().has(path) ? 'Unsaved changes — close' : 'Close'"
                (pointerdown)="$event.stopPropagation()"
                (click)="close($event, path)"
            >
                {{ groups.dirtyFiles().has(path) ? '●' : '✕' }}
            </button>
        </div>
    }
</div>
